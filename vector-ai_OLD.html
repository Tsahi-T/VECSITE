<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>וקטור על · אופק 324</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700;800;900&family=Heebo:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --pri:#60A5FA;--sec:#A78BFA;
  --pri-r:96;--pri-g:165;--pri-b:250;
  --sec-r:167;--sec-g:139;--sec-b:250;
  --bg:#030610;--ink:#F0F6FF;--dim:rgba(240,246,255,.88);
  --eo:cubic-bezier(.22,.9,.28,1);--es:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:'Heebo',sans-serif;-webkit-font-smoothing:antialiased;transition:background 1.4s}
#bg{position:fixed;inset:0;z-index:0;width:100%;height:100%}
#atmo{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse 90vw 80vh at 50% 45%,rgba(var(--pri-r),var(--pri-g),var(--pri-b),.09) 0%,transparent 70%);transition:background 1.2s}
#flash{position:fixed;inset:0;z-index:300;pointer-events:none;background:rgba(var(--pri-r),var(--pri-g),var(--pri-b),.22);opacity:0;transition:opacity .08s}
#flash.on{opacity:1}
.hbar{position:fixed;top:0;left:0;right:224px;z-index:50;height:62px;
  display:flex;align-items:center;justify-content:space-between;padding:0 36px;
  background:linear-gradient(180deg,rgba(3,6,16,.9) 0%,transparent 100%);
  backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.07)}
.logo{font-family:'Rubik',sans-serif;font-weight:900;font-size:20px;letter-spacing:.02em;
  background:linear-gradient(100deg,var(--pri) 0%,#fff 70%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  display:flex;align-items:baseline;gap:10px}
.logo-sub{font-family:'Space Mono',monospace;font-size:10px;font-weight:400;
  background:none;-webkit-background-clip:unset;background-clip:unset;
  color:rgba(var(--pri-r),var(--pri-g),var(--pri-b),.65);letter-spacing:.22em}
.ptrack{display:flex;align-items:center;gap:7px;position:absolute;left:50%;transform:translateX(-50%)}
.pdot{height:6px;border-radius:3px;background:rgba(255,255,255,.12);cursor:pointer;transition:all .5s var(--eo);width:6px}
.pdot.done{background:rgba(var(--pri-r),var(--pri-g),var(--pri-b),.4);width:8px}
.pdot.active{background:var(--pri);width:30px;box-shadow:0 0 14px rgba(var(--pri-r),var(--pri-g),var(--pri-b),.9)}
.slabel{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.18em;color:rgba(255,255,255,.3);direction:ltr}
#deck{position:fixed;inset:62px 224px 0 0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage{position:absolute;width:100%;max-width:1200px;display:flex;flex-direction:column;
  align-items:center;text-align:center;padding:0 28px;
  opacity:0;pointer-events:none;visibility:hidden}
.stage.active{opacity:1;pointer-events:auto;visibility:visible}
.stage.entering{animation:stIn .6s var(--eo) both}
.stage.exiting{animation:stOut .32s cubic-bezier(.4,0,1,.6) both;pointer-events:none}
@keyframes stIn{from{opacity:0;transform:translateY(28px) scale(.97);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes stOut{from{opacity:1;transform:none;filter:blur(0)}to{opacity:0;transform:translateY(-18px) scale(.97);filter:blur(8px)}}
.rv{opacity:0;transform:translateY(18px)}
.stage.active .rv{animation:rv .55s var(--eo) both;animation-delay:calc(var(--i,0)*70ms + 80ms)}
@keyframes rv{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.eyebrow{display:flex;align-items:center;justify-content:center;gap:14px;
  font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.3em;color:var(--pri);transition:color 1.2s}
.eyebrow::before,.eyebrow::after{content:'';display:block;width:50px;height:1px;
  background:linear-gradient(90deg,transparent,var(--pri));transition:background 1.2s}
.eyebrow::before{transform:scaleX(-1)}
.ttl{font-family:'Rubik',sans-serif;font-weight:900;letter-spacing:-.02em;line-height:1.06;
  font-size:clamp(28px,5vw,62px);margin:14px 0 10px}
.ttl .hi{background:linear-gradient(110deg,var(--pri) 0%,var(--sec) 55%,var(--ink) 90%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:clamp(15px,1.8vw,19px);color:rgba(240,246,255,.88);font-weight:300;max-width:780px;line-height:1.7;margin-bottom:28px}
.grid{display:grid;gap:14px;width:100%}
.grid.c2{grid-template-columns:repeat(2,1fr)}
.grid.c3{grid-template-columns:repeat(3,1fr)}
.grid.c4{grid-template-columns:repeat(4,1fr)}
.card{position:relative;padding:22px 22px 20px;border-radius:16px;text-align:right;
  background:rgba(255,255,255,.042);border:1px solid rgba(255,255,255,.1);overflow:hidden;
  cursor:default;transform-style:preserve-3d;transition:border-color .3s,box-shadow .3s;will-change:transform}
.card::before{content:'';position:absolute;top:0;right:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--pri),var(--sec));border-radius:0 16px 16px 0;opacity:.75}
.card:hover{border-color:rgba(var(--pri-r),var(--pri-g),var(--pri-b),.35);
  box-shadow:0 22px 55px -22px rgba(0,0,0,.9),0 0 0 1px rgba(var(--pri-r),var(--pri-g),var(--pri-b),.18)}
.card .shine{position:absolute;inset:0;border-radius:16px;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.14),transparent 65%);
  transition:opacity .3s;mix-blend-mode:screen}
.card:hover .shine{opacity:1}
.card-accent{position:absolute;top:0;right:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--pri),var(--sec));border-radius:0 16px 16px 0;opacity:.75}
.cn{font-family:'Space Mono',monospace;font-size:12px;color:var(--pri);letter-spacing:.1em;margin-bottom:10px;display:block}
.ct{font-size:16px;line-height:1.65;color:rgba(240,246,255,.9);font-weight:400}
.hero-ttl{font-size:clamp(32px,6.2vw,74px)!important;margin:18px 0 24px!important}
.msn{display:flex;gap:18px;align-items:flex-start;max-width:840px;padding:22px 24px;border-radius:18px;
  text-align:right;background:linear-gradient(135deg,rgba(var(--pri-r),var(--pri-g),var(--pri-b),.07),rgba(var(--sec-r),var(--sec-g),var(--sec-b),.04));
  border:1px solid rgba(var(--pri-r),var(--pri-g),var(--pri-b),.22);backdrop-filter:blur(20px);margin-bottom:24px}
.msn-tag{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.24em;color:var(--pri);
  writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;opacity:.75;flex-shrink:0}
.msn-txt{font-size:clamp(15px,1.9vw,20px);line-height:1.7;color:rgba(240,246,255,.96);font-weight:300}
.chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.chip{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.06em;padding:8px 16px;border-radius:100px;
  border:1px solid rgba(var(--pri-r),var(--pri-g),var(--pri-b),.22);color:var(--dim);
  background:rgba(var(--pri-r),var(--pri-g),var(--pri-b),.06)}
.chip b{color:var(--pri)}
.pipe{display:flex;align-items:flex-start;gap:0;width:100%;direction:ltr}
.ps{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;opacity:0}
.stage.active .ps{animation:rv .5s var(--es) both;animation-delay:calc(var(--pi,0)*110ms + 180ms)}
.ps-top{display:flex;align-items:center;width:100%;margin-bottom:18px}
.ps-badge{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;
  font-family:'Rubik',sans-serif;font-weight:800;font-size:18px;color:var(--bg);
  background:linear-gradient(135deg,var(--pri),var(--sec));box-shadow:0 0 24px rgba(var(--pri-r),var(--pri-g),var(--pri-b),.45);
  flex-shrink:0;z-index:2}
.ps-conn{flex:1;height:2px;position:relative;overflow:hidden;background:rgba(255,255,255,.08)}
.ps-conn::after{content:'';position:absolute;inset-block:0;right:-100%;width:50%;
  background:linear-gradient(90deg,transparent,var(--pri) 50%,transparent);animation:flowLine 2.5s linear infinite}
@keyframes flowLine{to{right:150%}}
.ps:last-child .ps-conn{display:none}
.ps-name{font-family:'Rubik',sans-serif;font-weight:700;font-size:15px;color:var(--ink);margin-bottom:7px;direction:rtl}
.ps-desc{font-size:14px;line-height:1.6;color:rgba(240,246,255,.88);font-weight:300;direction:rtl;padding:0 6px;text-align:center}
.rcat{padding:17px 16px 15px;border-radius:14px;text-align:right;
  background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.09);transition:border-color .3s,transform .3s}
.rcat:hover{border-color:rgba(var(--pri-r),var(--pri-g),var(--pri-b),.28);transform:translateY(-3px)}
.rcat-h{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-direction:row-reverse;justify-content:flex-end}
.rcat-dot{width:6px;height:6px;border-radius:50%;background:var(--pri);box-shadow:0 0 8px var(--pri);flex-shrink:0}
.rcat-h h4{font-family:'Rubik',sans-serif;font-weight:700;font-size:15px;color:var(--ink)}
.rcat ul{list-style:none;display:flex;flex-direction:column;gap:7px}
.rcat li{font-size:14px;line-height:1.5;color:rgba(240,246,255,.88);font-weight:400;padding-right:14px;position:relative}
.rcat li::before{content:'';position:absolute;right:0;top:7px;width:5px;height:5px;
  border-top:1.5px solid var(--pri);border-left:1.5px solid var(--pri);transform:rotate(135deg)}
.risk-ico{display:block;margin-bottom:11px;color:var(--pri)}
.nav{position:fixed;bottom:26px;left:calc(50% - 112px);transform:translateX(-50%);z-index:60;
  display:flex;align-items:center;gap:18px;padding:8px 10px 8px 20px;direction:ltr;
  background:rgba(3,6,16,.75);backdrop-filter:blur(22px);
  border:1px solid rgba(255,255,255,.1);border-radius:100px;
  box-shadow:0 24px 60px -18px rgba(0,0,0,.95)}
.ncnt{font-family:'Space Mono',monospace;font-size:13px;color:rgba(240,246,255,.35);min-width:58px;text-align:center}
.ncnt b{color:var(--pri)}
.nbtn{width:44px;height:44px;border-radius:50%;border:1.5px solid rgba(255,255,255,.35);
  background:rgba(255,255,255,.14);color:#fff;cursor:pointer;display:grid;place-items:center;
  transition:all .25s var(--eo);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset}
.nbtn:hover:not(:disabled){background:var(--pri);border-color:var(--pri);color:var(--bg);box-shadow:0 0 22px rgba(var(--pri-r),var(--pri-g),var(--pri-b),.6)}
.nbtn:disabled{opacity:.28;cursor:not-allowed}
.nbtn svg{width:18px;height:18px;stroke-width:2.5}
.hint{position:fixed;bottom:32px;left:28px;z-index:20;font-family:'Space Mono',monospace;
  font-size:10px;color:rgba(255,255,255,.2);letter-spacing:.1em;display:flex;gap:8px;align-items:center}
.hint kbd{border:1px solid rgba(255,255,255,.12);border-radius:5px;padding:2px 6px;color:rgba(255,255,255,.3);background:rgba(255,255,255,.04)}
.snav{position:fixed;top:0;right:0;bottom:0;width:224px;z-index:45;display:flex;flex-direction:column;
  background:rgba(2,5,16,.93);backdrop-filter:blur(22px);border-left:1px solid rgba(255,255,255,.07);transition:transform .45s var(--eo)}
.snav::before{content:'';position:absolute;top:0;left:-1px;bottom:0;width:1px;
  background:linear-gradient(180deg,transparent 5%,rgba(var(--pri-r),var(--pri-g),var(--pri-b),.55) 30%,rgba(var(--pri-r),var(--pri-g),var(--pri-b),.55) 70%,transparent 95%)}
.snav::after{content:'';position:absolute;bottom:14px;left:10px;width:18px;height:18px;
  border-left:1.5px solid rgba(var(--pri-r),var(--pri-g),var(--pri-b),.38);border-bottom:1.5px solid rgba(var(--pri-r),var(--pri-g),var(--pri-b),.38)}
.snav-top{position:relative;padding:18px 14px 14px;display:flex;flex-direction:column;align-items:center;gap:7px}
.snav-top::before{content:'';position:absolute;top:8px;left:10px;width:18px;height:18px;
  border-left:1.5px solid rgba(var(--pri-r),var(--pri-g),var(--pri-b),.38);border-top:1.5px solid rgba(var(--pri-r),var(--pri-g),var(--pri-b),.38)}
.snav-top::after{content:'';position:absolute;top:8px;right:10px;width:18px;height:18px;
  border-right:1.5px solid rgba(var(--pri-r),var(--pri-g),var(--pri-b),.38);border-top:1.5px solid rgba(var(--pri-r),var(--pri-g),var(--pri-b),.38)}
.snav-scan{position:absolute;left:14px;right:14px;height:1.5px;
  background:linear-gradient(90deg,transparent,rgba(var(--pri-r),var(--pri-g),var(--pri-b),.45),transparent);
  animation:scanLine 5s ease-in-out infinite;pointer-events:none;z-index:2}
@keyframes scanLine{0%,100%{top:12%}50%{top:78%}}
.snav-logo{width:76px;height:76px;object-fit:cover;border-radius:50%;
  border:1.5px solid rgba(var(--pri-r),var(--pri-g),var(--pri-b),.55);
  box-shadow:0 0 22px -4px rgba(var(--pri-r),var(--pri-g),var(--pri-b),.55);
  filter:brightness(1.15) saturate(1.6) contrast(1.1);
  animation:logoFloat 4.5s ease-in-out infinite;position:relative;z-index:1;transition:filter 1.2s,border-color 1.2s,box-shadow 1.2s}
@keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.snav-brand{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.28em;color:rgba(var(--pri-r),var(--pri-g),var(--pri-b),.6);text-align:center}
.snav-div{height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent)}
.snav-list{flex:1;padding:10px 8px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;position:relative}
.snav-list::before{content:'';position:absolute;top:18px;bottom:18px;left:22px;width:1px;
  background:linear-gradient(180deg,transparent,rgba(var(--pri-r),var(--pri-g),var(--pri-b),.22) 15%,rgba(var(--pri-r),var(--pri-g),var(--pri-b),.22) 85%,transparent)}
.si{display:flex;align-items:center;gap:10px;direction:ltr;padding:7px 10px;border-radius:10px;
  border:1px solid transparent;cursor:pointer;background:none;width:100%;font-family:inherit;transition:all .3s}
.si:hover{background:rgba(var(--pri-r),var(--pri-g),var(--pri-b),.07);border-color:rgba(var(--pri-r),var(--pri-g),var(--pri-b),.18)}
.si.done{opacity:.6}.si.active{background:rgba(var(--pri-r),var(--pri-g),var(--pri-b),.1);border-color:rgba(var(--pri-r),var(--pri-g),var(--pri-b),.3);opacity:1}
.si-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.18);transition:all .4s}
.si.done .si-dot{background:rgba(var(--pri-r),var(--pri-g),var(--pri-b),.45);border-color:rgba(var(--pri-r),var(--pri-g),var(--pri-b),.6)}
.si.active .si-dot{background:var(--pri);border-color:var(--pri);box-shadow:0 0 12px rgba(var(--pri-r),var(--pri-g),var(--pri-b),.9);transform:scale(1.4)}
.si-meta{display:flex;flex-direction:column;gap:1px;flex:1;min-width:0}
.si-n{font-family:'Space Mono',monospace;font-size:9px;color:rgba(240,246,255,.25);letter-spacing:.18em;transition:color .3s}
.si.active .si-n{color:rgba(var(--pri-r),var(--pri-g),var(--pri-b),.75)}
.si-name{font-size:12.5px;font-weight:500;color:rgba(240,246,255,.5);direction:rtl;text-align:right;transition:color .3s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.si.active .si-name{color:var(--ink);font-weight:600}.si:hover .si-name{color:rgba(240,246,255,.85)}
.snav-menu{display:none;position:fixed;top:12px;left:14px;z-index:60;width:40px;height:40px;
  border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(3,6,16,.86);
  backdrop-filter:blur(12px);color:var(--ink);cursor:pointer;align-items:center;justify-content:center;transition:all .25s}
.snav-menu svg{width:20px;height:20px}
.snav-bd{display:none;position:fixed;inset:0;z-index:42;background:rgba(0,0,0,.55);backdrop-filter:blur(5px)}
.snav-bd.on{display:block}

/* ═══ CINEMATIC ═══ */
.stage-cine{justify-content:center;padding:0!important;max-width:none!important;width:100%}
.cine-wrap{position:absolute;inset:0}
.cb{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:80px 60px;text-align:center;pointer-events:none;
  opacity:0;transition:opacity .9s ease,transform .9s ease}
.cb.show{opacity:1;pointer-events:auto}
.cb.fade{opacity:0;transform:scale(.97)}
.cb1-tag{font-family:'Space Mono',monospace;font-size:13px;letter-spacing:.35em;
  color:rgba(96,165,250,.85);margin-bottom:22px}
.cb1-line{font-family:'Rubik',sans-serif;font-weight:300;font-size:clamp(22px,3.5vw,40px);
  color:rgba(240,246,255,.95);line-height:1.6;max-width:700px}
.cb2-word{font-family:'Rubik',sans-serif;font-weight:900;
  font-size:clamp(40px,7vw,80px);color:var(--pri);letter-spacing:.05em;
  text-shadow:0 0 80px rgba(var(--pri-r),var(--pri-g),var(--pri-b),.5);line-height:1.1}
.cb3-big{font-family:'Rubik',sans-serif;font-weight:900;line-height:.95;letter-spacing:-.03em;
  font-size:clamp(70px,14vw,155px);
  background:linear-gradient(120deg,var(--pri) 0%,#fff 45%,var(--sec) 90%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 50px rgba(var(--pri-r),var(--pri-g),var(--pri-b),.4));margin-bottom:24px}
.cb3-sub{font-size:clamp(17px,2.3vw,25px);color:rgba(240,246,255,.78);font-weight:300;line-height:1.65;max-width:720px}
.cb4-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:860px}
.cb4-lbl{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.22em;
  color:rgba(var(--pri-r),var(--pri-g),var(--pri-b),.5);text-align:center}
.cb4-row{display:flex;gap:14px;justify-content:center;width:100%}
.cb4-box{padding:15px 22px;border-radius:14px;cursor:pointer;
  border:1px solid rgba(var(--pri-r),var(--pri-g),var(--pri-b),.28);
  background:rgba(var(--pri-r),var(--pri-g),var(--pri-b),.09);
  font-family:'Rubik',sans-serif;font-weight:700;font-size:16px;color:var(--ink);
  min-width:190px;text-align:center;transition:all .3s}
.cb4-box:hover{background:rgba(var(--pri-r),var(--pri-g),var(--pri-b),.2);
  border-color:var(--pri);box-shadow:0 0 30px -8px rgba(var(--pri-r),var(--pri-g),var(--pri-b),.5);transform:translateY(-3px)}
.cb4-sub{font-family:'Heebo',sans-serif;font-size:12.5px;font-weight:300;color:var(--dim);margin-top:5px}
.cb4-f2{border-color:rgba(var(--sec-r),var(--sec-g),var(--sec-b),.28);background:rgba(var(--sec-r),var(--sec-g),var(--sec-b),.09)}
.cb4-f2:hover{background:rgba(var(--sec-r),var(--sec-g),var(--sec-b),.2);border-color:var(--sec);box-shadow:0 0 30px -8px rgba(var(--sec-r),var(--sec-g),var(--sec-b),.5)}
.cb4-v1{border-color:rgba(245,158,11,.3);background:rgba(245,158,11,.08);min-width:220px}
.cb4-v1:hover{background:rgba(245,158,11,.18);border-color:#F59E0B;box-shadow:0 0 30px -8px rgba(245,158,11,.45)}
.cb4-v2{min-width:220px}
.cb4-out{min-width:460px;background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.16)}
.cb4-out:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.35)}
.cb4-arrow{color:rgba(var(--pri-r),var(--pri-g),var(--pri-b),.45);font-size:22px;line-height:1}
.cb4-hint{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.12em;color:rgba(240,246,255,.22);margin-top:4px}
.cb .cb4-wrap > *{opacity:0;transform:translateY(10px);transition:opacity .5s,transform .5s}
.cb.show .cb4-wrap > *:nth-child(1){opacity:1;transform:none;transition-delay:.05s}
.cb.show .cb4-wrap > *:nth-child(2){opacity:1;transform:none;transition-delay:.15s}

document.querySelectorAll('.card,.vcard,.fnd-card').forEach(card=>{

    const r=card.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
    const cx=r.width/2,cy=r.height/2;
    card.style.transform=`perspective(900px) rotateX(${((y-cy)/cy)*-8}deg) rotateY(${((x-cx)/cx)*8}deg) translateZ(6px)`;
    const sh=card.querySelector('.shine');if(sh)sh.style.background=`radial-gradient(circle at ${x}px ${y}px,rgba(255,255,255,.16),transparent 60%)`;
  });
  card.addEventListener('mouseleave',()=>{card.style.transform='';const sh=card.querySelector('.shine');if(sh)sh.style.background='';});
});
const canvas=document.getElementById('bg');const ctx=canvas.getContext('2d');
let W,H,nodes=[];const N=55,MD=130;let cRgb=[96,165,250],tRgb=[96,165,250];let mouse={x:0,y:0};
function initC(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;
  if(!nodes.length){nodes=Array.from({length:N},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35,r:Math.random()*2+1.2}));}}
window.addEventListener('resize',initC);initC();
window.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});
function lerpRgb(a,b,t){return a.map((v,i)=>v+(b[i]-v)*t)}
function rgbS(r,a){return`rgba(${r.map(Math.round).join(',')},${a})`}
function draw(){
  ctx.clearRect(0,0,W,H);cRgb=lerpRgb(cRgb,tRgb,.03);
  nodes.forEach(n=>{n.x+=n.vx;n.y+=n.vy;
    if(n.x<-20)n.x=W+20;else if(n.x>W+20)n.x=-20;
    if(n.y<-20)n.y=H+20;else if(n.y>H+20)n.y=-20;
    const dx=n.x-mouse.x,dy=n.y-mouse.y,d=Math.sqrt(dx*dx+dy*dy);
    if(d<100){const f=(100-d)/100;n.vx+=dx/d*f*.4;n.vy+=dy/d*f*.4}
    n.vx*=.99;n.vy*=.99;const sp=Math.sqrt(n.vx*n.vx+n.vy*n.vy);
    if(sp>.7){n.vx=n.vx/sp*.7;n.vy=n.vy/sp*.7}});
  for(let i=0;i<nodes.length;i++){for(let j=i+1;j<nodes.length;j++){
    const a=nodes[i],b=nodes[j],d=Math.hypot(a.x-b.x,a.y-b.y);
    if(d<MD){ctx.strokeStyle=rgbS(cRgb,(1-d/MD)*.42);ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}}}
  nodes.forEach(n=>{ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,Math.PI*2);ctx.fillStyle=rgbS(cRgb,.75);ctx.fill();
    const g=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,n.r*6);g.addColorStop(0,rgbS(cRgb,.15));g.addColorStop(1,'transparent');
    ctx.beginPath();ctx.arc(n.x,n.y,n.r*6,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();});

document.getElementById('snavLogo').src=OWL;
const snavList=document.getElementById('snavList');
STAGES.forEach((s,i)=>{const btn=document.createElement('button');btn.className='si';btn.id='si'+i;
  btn.innerHTML=`<div class="si-dot"></div><div class="si-meta"><span class="si-n">${String(i).padStart(2,'0')}</span><span class="si-name">${s.short}</span></div>`;
  btn.onclick=()=>go(i);snavList.appendChild(btn);});
const siItems=[...document.querySelectorAll('.si')];
function updateSidebar(){siItems.forEach((el,i)=>{el.className='si'+(i<cur?' done':i===cur?' active':'')});}
let cineTimers=[];
function clearCine(){cineTimers.forEach(clearTimeout);cineTimers=[];}
function startCine(){
  clearCine();
  const beats=['cb1','cb2','cb3','cb4'].map(id=>document.getElementById(id));
  beats.forEach(b=>{if(b){b.classList.remove('show','fade');}});
  const seq=[{b:0,t:300,show:true},{b:0,t:2800,hide:true},{b:1,t:3100,show:true},
    {b:1,t:5500,hide:true},{b:2,t:5800,show:true},{b:2,t:8500,hide:true},{b:3,t:8800,show:true}];
  seq.forEach(({b,t,show,hide})=>{
    cineTimers.push(setTimeout(()=>{
      const se=document.querySelector('.stage.active.stage-cine');if(!se)return;
      if(show)beats[b].classList.add('show');
      if(hide){beats[b].classList.add('fade');setTimeout(()=>beats[b].classList.remove('show','fade'),900);}
    },t));});}
const stageEls=[...document.querySelectorAll('.stage')];
const dots=[...document.querySelectorAll('.pdot')];
const prevBtn=document.getElementById('prevBtn');const nextBtn=document.getElementById('nextBtn');
const ncur=document.getElementById('ncur');document.getElementById('ntot').textContent=String(STAGES.length).padStart(2,'0');
const slbl=document.getElementById('slbl');const flashEl=document.getElementById('flash');
const atmo=document.getElementById('atmo');const root=document.documentElement;
let cur=0,busy=false;
function applyTheme(t){
  root.style.setProperty('--pri',t.pri);root.style.setProperty('--sec',t.sec);
  ['r','g','b'].forEach((c,ci)=>{root.style.setProperty(`--pri-${c}`,t.pr[ci]);root.style.setProperty(`--sec-${c}`,t.sr[ci]);});
  document.body.style.background=t.bg;tRgb=[...t.pr];
  atmo.style.background=`radial-gradient(ellipse 90vw 80vh at 50% 50%,rgba(${t.pr.join(',')},0.09) 0%,transparent 70%)`;}
function updateUI(){
  const p=String(cur+1).padStart(2,'0');ncur.textContent=p;
  slbl.textContent=`${p} / ${String(STAGES.length).padStart(2,'0')}`;
  dots.forEach((d,i)=>{d.className='pdot'+(i<cur?' done':i===cur?' active':'');});
  prevBtn.disabled=cur===0;nextBtn.disabled=cur===STAGES.length-1;updateSidebar();}
async function go(n){
  n=Math.max(0,Math.min(STAGES.length-1,n));if(n===cur||busy)return;
  busy=true;clearCine();
  stageEls[cur].classList.remove('active');stageEls[cur].classList.add('exiting');
  await wait(90);applyTheme(T[n]);flashEl.classList.add('on');await wait(70);flashEl.classList.remove('on');
  stageEls[cur].classList.remove('exiting');cur=n;updateUI();
  stageEls[cur].classList.add('active','entering');
  if(STAGES[cur].type==='cine')setTimeout(startCine,400);
  await wait(650);stageEls[cur].classList.remove('entering');busy=false;}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
applyTheme(T[0]);stageEls[0].classList.add('active','entering');
setTimeout(()=>{stageEls[0].classList.remove('entering');startCine();},700);updateUI();
prevBtn.onclick=()=>go(cur-1);nextBtn.onclick=()=>go(cur+1);
addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1);}
  else if(['ArrowRight','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1);}
  else if(e.key==='Home')go(0);else if(e.key==='End')go(STAGES.length-1);});
let tx=0;
addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>55)dx<0?go(cur+1):go(cur-1);});
const snavEl=document.getElementById('snav');const snavBd=document.getElementById('snavBd');
document.getElementById('snavMenu').onclick=()=>{snavEl.classList.toggle('open');snavBd.classList.toggle('on');};
snavBd.onclick=()=>{snavEl.classList.remove('open');snavBd.classList.remove('on');};
</script></body></html>
